name = "manohub-staging-container"
main = "worker/index.ts"
compatibility_date = "2026-07-21"

[triggers]
crons = ["*/5 * * * *"]

[[containers]]
class_name = "ManohubContainer"
image = "./Dockerfile"
max_instances = 2
instance_type = "basic"

[[durable_objects.bindings]]
class_name = "ManohubContainer"
name = "MANOHUB_CONTAINER"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ManohubContainer"]

[vars]
MANOHUB_ENVIRONMENT = "staging"
VITE_SUPABASE_URL = "STAGING_SUPABASE_URL"
VITE_SUPABASE_ANON_KEY = "STAGING_SUPABASE_ANON_KEY"
