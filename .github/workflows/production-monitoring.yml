name: Hyderra Production Monitoring

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hyderra-production-monitoring
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_URL: ${{ vars.MANOHUB_PRODUCTION_URL || 'https://manohub-container.mohamedbangura.workers.dev' }}
    steps:
      - name: Verify health and environment
        run: |
          health=$(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 5 --max-time 20 "${PRODUCTION_URL%/}/api/health")
          node -e 'const h=JSON.parse(process.argv[1]);if(h.status!=="healthy"||h.environment!=="production")process.exit(1)' "$health"
      - name: Verify current Hyderra frontend
        run: |
          base="${PRODUCTION_URL%/}"
          html=$(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 5 --max-time 20 "$base/")
          grep -Fq '/hyderra-favicon.svg?v=2' <<<"$html"
          asset=$(grep -Eo '/assets/index-[A-Za-z0-9_-]+\.js' <<<"$html" | head -n 1)
          test -n "$asset"
          bundle=$(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 5 --max-time 20 "$base$asset")
          grep -Fq '/hyderra-horizontal.svg?v=2' <<<"$bundle"
      - name: Enforce warm response-time ceiling
        run: |
          seconds=$(curl --fail --silent --show-error --output /dev/null --retry 2 --retry-all-errors --retry-delay 3 --max-time 20 --write-out '%{time_total}' "${PRODUCTION_URL%/}/api/health")
          awk -v observed="$seconds" 'BEGIN { if (observed > 5.0) exit 1 }'
