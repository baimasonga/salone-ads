name: Manohub CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Linter & Typechecks
      run: npm run lint

    - name: Run Automated Tests
      run: npm test

    - name: Build Production Server and Frontend
      run: npm run build

    - name: Verify Runtime RLS Boundaries
      run: npm run test:rls
      env:
        SUPABASE_URL: https://rffjehmbrycztiekcyho.supabase.co
        SUPABASE_ANON_KEY: sb_publishable_HiizVcWA4JQxSoCxO3N6kQ_Ov4hGGmk

    - name: Install Browser Test Runtime
      run: npx playwright install --with-deps chromium

    - name: Run Critical Journey Tests
      run: npm run test:e2e
      env:
        VITE_SUPABASE_URL: https://rffjehmbrycztiekcyho.supabase.co
        VITE_SUPABASE_ANON_KEY: sb_publishable_HiizVcWA4JQxSoCxO3N6kQ_Ov4hGGmk

    - name: Upload Browser Failure Evidence
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ github.run_id }}
        path: |
          playwright-report/
          test-results/
        if-no-files-found: ignore
        retention-days: 14
