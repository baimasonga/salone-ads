name: Manohub CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Linter & Typechecks
      run: npm run lint

    - name: Run Automated Tests
      run: npm test

    - name: Build Production Server and Frontend
      run: npm run build

    - name: Run Local Load and Performance Gate
      run: |
        npm start > /tmp/manohub-performance-server.log 2>&1 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true' EXIT
        for attempt in {1..30}; do
          curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null && break
          if [ "$attempt" -eq 30 ]; then
            cat /tmp/manohub-performance-server.log
            exit 1
          fi
          sleep 1
        done
        npm run test:performance

    - name: Verify Runtime RLS Boundaries
      run: npm run test:rls
      env:
        SUPABASE_URL: https://rffjehmbrycztiekcyho.supabase.co
        SUPABASE_ANON_KEY: sb_publishable_HiizVcWA4JQxSoCxO3N6kQ_Ov4hGGmk

    - name: Install Browser Test Runtime
      run: npx playwright install --with-deps chromium

    - name: Run Critical Journey Tests
      run: npm run test:e2e
      env:
        VITE_SUPABASE_URL: https://rffjehmbrycztiekcyho.supabase.co
        VITE_SUPABASE_ANON_KEY: sb_publishable_HiizVcWA4JQxSoCxO3N6kQ_Ov4hGGmk

    - name: Upload Browser Failure Evidence
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ github.run_id }}
        path: |
          playwright-report/
          test-results/
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload Performance Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: performance-report-${{ github.run_id }}
        path: performance-report.json
        if-no-files-found: ignore
        retention-days: 30
