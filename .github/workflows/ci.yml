name: Manohub CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Database-backed gates run against a dedicated CI/staging Supabase project.
    # Configure CI_SUPABASE_URL + CI_SUPABASE_ANON_KEY (or the STAGING_*
    # equivalents) as repository variables. They are deliberately not defaulted
    # to production: these gates drive real browser journeys.
    env:
      CI_SUPABASE_URL: ${{ vars.CI_SUPABASE_URL || vars.STAGING_SUPABASE_URL }}
      CI_SUPABASE_ANON_KEY: ${{ vars.CI_SUPABASE_ANON_KEY || vars.STAGING_SUPABASE_ANON_KEY }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Linter & Typechecks
      run: npm run lint

    - name: Typecheck Cloudflare Worker
      run: npm run lint:worker

    - name: Validate and Checksum Migrations
      run: npm run validate:migrations

    - name: Run Automated Tests
      run: npm test

    - name: Build Production Server and Frontend
      run: npm run build

    - name: Enforce Low-Bandwidth Budget
      run: npm run test:low-bandwidth

    - name: Run Local Load and Performance Gate
      run: |
        npm start > /tmp/manohub-performance-server.log 2>&1 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true' EXIT
        for attempt in {1..30}; do
          curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null && break
          if [ "$attempt" -eq 30 ]; then
            cat /tmp/manohub-performance-server.log
            exit 1
          fi
          sleep 1
        done
        npm run test:performance

    - name: Check Database Gate Configuration
      id: dbgate
      run: |
        if [ -n "$CI_SUPABASE_URL" ] && [ -n "$CI_SUPABASE_ANON_KEY" ]; then
          echo "configured=true" >> "$GITHUB_OUTPUT"
        else
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=Database gates skipped::Set the CI_SUPABASE_URL and CI_SUPABASE_ANON_KEY repository variables to a CI/staging Supabase project to enable the RLS, journey and accessibility gates."
        fi

    - name: Verify Runtime RLS Boundaries
      if: steps.dbgate.outputs.configured == 'true'
      run: npm run test:rls
      env:
        SUPABASE_URL: ${{ env.CI_SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ env.CI_SUPABASE_ANON_KEY }}
        RLS_PROBE_EMAIL: ${{ vars.RLS_PROBE_EMAIL }}
        RLS_PROBE_PASSWORD: ${{ secrets.RLS_PROBE_PASSWORD }}

    - name: Install Browser Test Runtime
      if: steps.dbgate.outputs.configured == 'true'
      run: npx playwright install --with-deps chromium

    - name: Run Critical Journey Tests
      if: steps.dbgate.outputs.configured == 'true'
      run: npm run test:e2e
      env:
        VITE_SUPABASE_URL: ${{ env.CI_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ env.CI_SUPABASE_ANON_KEY }}

    - name: Run Accessibility Audit
      if: steps.dbgate.outputs.configured == 'true'
      run: npm run test:a11y
      env:
        VITE_SUPABASE_URL: ${{ env.CI_SUPABASE_URL }}
        VITE_SUPABASE_ANON_KEY: ${{ env.CI_SUPABASE_ANON_KEY }}

    - name: Upload Browser Failure Evidence
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ github.run_id }}
        path: |
          playwright-report/
          test-results/
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload Performance Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: performance-report-${{ github.run_id }}
        path: performance-report.json
        if-no-files-found: ignore
        retention-days: 30

    - name: Upload Low-Bandwidth Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: low-bandwidth-report-${{ github.run_id }}
        path: low-bandwidth-report.json
        if-no-files-found: ignore
        retention-days: 30

    - name: Upload Accessibility Failure Evidence
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: accessibility-report-${{ github.run_id }}
        path: |
          accessibility-report/
          test-results/
        if-no-files-found: ignore
        retention-days: 30
