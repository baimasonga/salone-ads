name: Deploy to Cloudflare Containers

# Single-branch production release workflow.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate the release without deploying to production'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-containers-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate application
        run: |
          npm run lint
          npm run lint:worker
          npm test
          npm run build

      - name: Validate migration ordering
        shell: bash
        run: |
          migration_dir='migrations/manohub-new-project'
          bootstrap_migrations=(
            'EXPORT_from_old_project.sql'
            'full_setup.sql'
          )
          mapfile -t all_migrations < <(find "$migration_dir" -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort)
          migrations=()
          for migration in "${all_migrations[@]}"; do
            test -s "$migration_dir/$migration" || {
              echo "::error file=$migration_dir/$migration::Migration file is empty."
              exit 1
            }
            if [[ "$migration" == 'EXPORT_from_old_project.sql' || "$migration" == 'full_setup.sql' ]]; then
              continue
            fi
            if [[ ! "$migration" =~ ^[0-9]+_[A-Za-z0-9_.-]+\.sql$ ]]; then
              echo "::error file=$migration_dir/$migration::Incremental migrations must start with a numeric prefix followed by an underscore and a safe SQL filename."
              exit 1
            fi
            migrations+=("$migration")
          done

          for migration in "${bootstrap_migrations[@]}"; do
            [[ " ${all_migrations[*]} " == *" $migration "* ]] || {
              echo "::error file=$migration_dir/$migration::Required bootstrap migration is missing."
              exit 1
            }
          done
          if [ "${#migrations[@]}" -eq 0 ]; then
            echo "::error::No numbered Manohub migrations were found."
            exit 1
          fi
          duplicates=$(printf '%s\n' "${migrations[@]}" | sed -E 's/^([0-9]+).*/\1/' | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "::error::Duplicate migration sequence numbers: $duplicates"
            exit 1
          fi
          for migration in "${migrations[@]}"; do
            echo "Ordered migration: $migration"
          done
          echo "Validated ${#bootstrap_migrations[@]} bootstrap and ${#migrations[@]} ordered migration files."

      - name: Write build-time environment
        run: |
          cat > .env <<'EOF'
          VITE_SUPABASE_URL=https://rffjehmbrycztiekcyho.supabase.co
          VITE_SUPABASE_ANON_KEY=sb_publishable_HiizVcWA4JQxSoCxO3N6kQ_Ov4hGGmk
          EOF

      - name: Validate Cloudflare release
        run: npx wrangler deploy --config wrangler.containers.toml --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy production container
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: npx wrangler deploy --config wrangler.containers.toml --containers-rollout=immediate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set optional Gemini secret
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --config wrangler.containers.toml
          else
            echo "GEMINI_API_KEY is not configured; AI fallback behavior remains active."
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production health
        if: ${{ (github.event_name == 'push' || !inputs.dry_run) && vars.MANOHUB_PRODUCTION_URL != '' }}
        env:
          PRODUCTION_URL: ${{ vars.MANOHUB_PRODUCTION_URL }}
        run: |
          response=$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 --max-time 20 "${PRODUCTION_URL%/}/api/health")
          node -e '
            const health = JSON.parse(process.argv[1]);
            if (health.status !== "healthy" || health.environment !== "production") {
              console.error("Production health check failed:", health);
              process.exit(1);
            }
            console.log("Production healthy:", health.version, health.measurementProtection);
          ' "$response"

      - name: Report missing smoke-check URL
        if: ${{ (github.event_name == 'push' || !inputs.dry_run) && vars.MANOHUB_PRODUCTION_URL == '' }}
        run: |
          echo "::warning::Set MANOHUB_PRODUCTION_URL as a repository variable to enable the live health check."
          echo "### Post-deployment smoke check" >> "$GITHUB_STEP_SUMMARY"
          echo "Not run: MANOHUB_PRODUCTION_URL is not configured." >> "$GITHUB_STEP_SUMMARY"

      - name: Release summary
        if: always()
        run: |
          echo "### Manohub production release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gates: lint, worker typecheck, tests, production build, migration ordering and Wrangler dry run" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment requested: \`${{ github.event_name == 'push' || !inputs.dry_run }}\`" >> "$GITHUB_STEP_SUMMARY"
