name: Staging upload diagnostics
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
      staging_only:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test staging upload authorization
        run: node scripts/diagnostics/staging-upload.mjs
        env:
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_SERVICE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          TEST_USER_ID: 5f60752b-dd5e-4563-9592-23d4c2798133
          TEST_ORG_ID: 55a3dca8-e67a-4784-99f0-108bda01214a

  scanner:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Measure antivirus under staging resource limits
        run: bash scripts/diagnostics/scanner-resources.sh

  container-state:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/diagnostics/container-state.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  image-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/reliability-and-feature-cleanup
      - name: Verify release identity inside built image
        env:
          VITE_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
        run: |
          release_commit=$(git rev-parse HEAD)
          printf '{"commit":"%s"}\n' "$release_commit" > public/release.json
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$VITE_SUPABASE_URL" "$VITE_SUPABASE_ANON_KEY" > .env
          docker build --target build --tag staging-frontend-probe . > /tmp/build-probe.log 2>&1 || { tail -40 /tmp/build-probe.log; exit 1; }
          actual=$(docker run --rm --entrypoint cat staging-frontend-probe /app/dist/release.json)
          node -e 'if(JSON.parse(process.argv[1]).commit!==process.argv[2])process.exit(1);console.log("Built frontend matches checked-out release:",process.argv[2]);' "$actual" "$release_commit"
