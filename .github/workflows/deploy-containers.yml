name: Temporary staging administrator acceptance
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
      staging_only:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  email-account-check:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/diagnostics/email-account-check.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
