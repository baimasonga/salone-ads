name: Deploy to Cloudflare Containers

# One main branch, with validation and staging promotion gates.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate the release without deploying'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-containers-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      staging_enabled: ${{ steps.staging.outputs.enabled }}
      release_version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate application
        run: |
          npm run lint
          npm run lint:worker
          npm test
          npm run build
      - name: Enforce low-bandwidth budget
        run: npm run test:low-bandwidth
      - name: Upload low-bandwidth report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: low-bandwidth-report-${{ github.run_id }}
          path: low-bandwidth-report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Run local load and performance gate
        run: |
          npm start > /tmp/manohub-performance-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null && break
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/manohub-performance-server.log
              exit 1
            fi
            sleep 1
          done
          npm run test:performance
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-report-${{ github.run_id }}
          path: performance-report.json
          if-no-files-found: ignore
          retention-days: 30
      # These pre-deploy gates are read-only, so they target the live project by
      # default and always run — the production job promotes on this job
      # succeeding, so a skipped gate would let a weaker build through. Set
      # CI_SUPABASE_URL / CI_SUPABASE_ANON_KEY (or the STAGING_* equivalents) to
      # point them at a dedicated project instead.
      - name: Verify runtime RLS boundaries
        run: npm run test:rls
        env:
          SUPABASE_URL: ${{ vars.CI_SUPABASE_URL || vars.STAGING_SUPABASE_URL || 'https://rffjehmbrycztiekcyho.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ vars.CI_SUPABASE_ANON_KEY || vars.STAGING_SUPABASE_ANON_KEY || 'sb_publishable_HiizVcWA4JQxSoCxO3N6kQ_Ov4hGGmk' }}
          RLS_PROBE_EMAIL: ${{ vars.RLS_PROBE_EMAIL }}
          RLS_PROBE_PASSWORD: ${{ secrets.RLS_PROBE_PASSWORD }}
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Verify critical user journeys
        run: npm run test:e2e
        env:
          VITE_SUPABASE_URL: ${{ vars.CI_SUPABASE_URL || vars.STAGING_SUPABASE_URL || 'https://rffjehmbrycztiekcyho.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.CI_SUPABASE_ANON_KEY || vars.STAGING_SUPABASE_ANON_KEY || 'sb_publishable_HiizVcWA4JQxSoCxO3N6kQ_Ov4hGGmk' }}
      - name: Verify public accessibility
        run: npm run test:a11y
        env:
          VITE_SUPABASE_URL: ${{ vars.CI_SUPABASE_URL || vars.STAGING_SUPABASE_URL || 'https://rffjehmbrycztiekcyho.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.CI_SUPABASE_ANON_KEY || vars.STAGING_SUPABASE_ANON_KEY || 'sb_publishable_HiizVcWA4JQxSoCxO3N6kQ_Ov4hGGmk' }}
      - name: Validate and checksum migrations
        run: node scripts/validate-migrations.mjs > migration-manifest.json
      - name: Validate production Cloudflare release
        run: npx wrangler deploy --config wrangler.containers.toml --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Detect staging configuration
        id: staging
        env:
          STAGING_URL: ${{ vars.MANOHUB_STAGING_URL }}
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$STAGING_URL" ] && [ -n "$STAGING_SUPABASE_URL" ] && [ -n "$STAGING_SUPABASE_ANON_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Staging is not configured; production will use the validated legacy promotion path."
          fi
      - name: Resolve release version
        id: release
        run: echo "version=manohub-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Upload migration manifest
        uses: actions/upload-artifact@v4
        with:
          name: migration-manifest-${{ steps.release.outputs.version }}
          path: migration-manifest.json
          retention-days: 90

  staging:
    name: Deploy and verify staging
    needs: validate
    if: ${{ needs.validate.outputs.staging_enabled == 'true' && (github.event_name == 'push' || !inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write staging build environment
        env:
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
        run: |
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$STAGING_SUPABASE_URL" "$STAGING_SUPABASE_ANON_KEY" > .env
          sed -i "s|STAGING_SUPABASE_URL|$STAGING_SUPABASE_URL|g; s|STAGING_SUPABASE_ANON_KEY|$STAGING_SUPABASE_ANON_KEY|g" wrangler.staging.toml
      - name: Validate staging release
        run: npx wrangler deploy --config wrangler.staging.toml --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy staging container
        run: npx wrangler deploy --config wrangler.staging.toml --containers-rollout=immediate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify staging health
        env:
          STAGING_URL: ${{ vars.MANOHUB_STAGING_URL }}
        run: |
          response=$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 --max-time 20 "${STAGING_URL%/}/api/health")
          node -e 'const h=JSON.parse(process.argv[1]);if(h.status!=="healthy"||h.environment!=="staging")process.exit(1)' "$response"

  production:
    name: Promote and verify production
    needs: [validate, staging]
    if: ${{ always() && needs.validate.result == 'success' && (needs.staging.result == 'success' || needs.staging.result == 'skipped') && (github.event_name == 'push' || !inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Write production build environment
        run: |
          cat > .env <<'EOF'
          VITE_SUPABASE_URL=https://rffjehmbrycztiekcyho.supabase.co
          VITE_SUPABASE_ANON_KEY=sb_publishable_HiizVcWA4JQxSoCxO3N6kQ_Ov4hGGmk
          EOF
          sed -i "s|RELEASE_VERSION = .*|RELEASE_VERSION = \"${GITHUB_SHA}\"|" wrangler.containers.toml
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > public/release.json
      - name: Set optional Gemini secret
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY --config wrangler.containers.toml
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Secret updates create a Worker version. Deploy last so a secret update
      # can never reactivate the previous application bundle.
      - name: Deploy production container
        run: npx wrangler deploy --config wrangler.containers.toml --containers-rollout=immediate | tee wrangler-production-deploy.log
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Resolve production URL
        id: production-url
        env:
          CONFIGURED_URL: ${{ vars.MANOHUB_PRODUCTION_URL }}
        run: |
          resolved_url="$CONFIGURED_URL"
          if [ -z "$resolved_url" ]; then
            resolved_url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' wrangler-production-deploy.log | tail -n 1 || true)
          fi
          if [ -z "$resolved_url" ]; then
            echo "::error::Could not resolve the production URL from MANOHUB_PRODUCTION_URL or Wrangler output."
            exit 1
          fi
          echo "url=${resolved_url%/}" >> "$GITHUB_OUTPUT"
      - name: Verify production health
        env:
          PRODUCTION_URL: ${{ steps.production-url.outputs.url }}
        run: |
          response=$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 --max-time 20 "${PRODUCTION_URL%/}/api/health")
          node -e 'const h=JSON.parse(process.argv[1]);if(h.status!=="healthy"||h.environment!=="production")process.exit(1)' "$response"
      - name: Verify deployed release identity
        env:
          PRODUCTION_URL: ${{ steps.production-url.outputs.url }}
        run: |
          for attempt in {1..24}; do
            response=$(curl --fail --silent --show-error --max-time 20 "${PRODUCTION_URL%/}/release.json?commit=${GITHUB_SHA}&attempt=${attempt}" || true)
            if node -e 'const r=JSON.parse(process.argv[1]);process.exit(r.commit===process.env.GITHUB_SHA?0:1)' "$response" 2>/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Production did not serve release ${GITHUB_SHA} within the propagation window."
          exit 1
      - name: Verify deployed customer support navigation
        env:
          PRODUCTION_URL: ${{ steps.production-url.outputs.url }}
        run: |
          html=$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 --max-time 20 "${PRODUCTION_URL%/}/")
          asset=$(printf '%s' "$html" | grep -Eo '/assets/index-[A-Za-z0-9_-]+\.js' | head -n 1)
          test -n "$asset"
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 --max-time 20 "${PRODUCTION_URL%/}${asset}" | grep -Fq 'Customer Support Centre'
          bundle=$(curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 --max-time 20 "${PRODUCTION_URL%/}${asset}")
          for label in 'Business Directory' 'Influencer Marketplace' 'Events Management' 'Tourism Management' 'Automated Subscription Billing' 'Performance & Attribution' 'Tenders & Document Intelligence' 'Pipeline & Recommendations' 'Billing & Renewals'; do
            printf '%s' "$bundle" | grep -Fq "$label"
          done
      - name: Verify production performance
        env:
          PERFORMANCE_TARGET_URL: ${{ steps.production-url.outputs.url }}
          PERFORMANCE_PROFILE: production
          PERFORMANCE_REPORT_PATH: performance-report-production.json
        run: npm run test:performance
      - name: Upload production performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-performance-${{ needs.validate.outputs.release_version }}
          path: performance-report-production.json
          if-no-files-found: error
          retention-days: 90
      - name: Resolve rollback commit
        id: rollback
        run: echo "commit=$(git rev-parse HEAD^)" >> "$GITHUB_OUTPUT"
      - name: Create release and rollback manifest
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.release_version }}
          STAGING_ENABLED: ${{ needs.validate.outputs.staging_enabled }}
          ROLLBACK_COMMIT: ${{ steps.rollback.outputs.commit }}
        run: |
          node -e 'const fs=require("fs");fs.writeFileSync("release-manifest.json",JSON.stringify({release_version:process.env.RELEASE_VERSION,commit:process.env.GITHUB_SHA,rollback_commit:process.env.ROLLBACK_COMMIT,staging_verified:process.env.STAGING_ENABLED==="true",deployed_at:new Date().toISOString(),workflow_run:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`},null,2))'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.validate.outputs.release_version }}
          path: release-manifest.json
          retention-days: 365
      - name: Release summary
        run: |
          echo "### ${{ needs.validate.outputs.release_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Staging verified: \`${{ needs.validate.outputs.staging_enabled }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rollback commit: \`${{ steps.rollback.outputs.commit }}\`" >> "$GITHUB_STEP_SUMMARY"
