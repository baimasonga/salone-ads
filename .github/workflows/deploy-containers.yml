name: Read-only production readiness audit
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
      staging_only:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read production release and readiness indicators
        run: node scripts/production-readiness-audit.mjs
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRODUCTION_URL: ${{ vars.MANOHUB_PRODUCTION_URL }}
          MIGRATIONS_COMMIT: ${{ vars.PRODUCTION_DATABASE_MIGRATIONS_COMMIT }}
      - uses: actions/upload-artifact@v4
        with:
          name: production-readiness-audit
          path: production-readiness-audit.json
          retention-days: 7
