name: Temporary staging administrator acceptance
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
      staging_only:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  staging-email-config:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check staging email setting presence only
        run: node scripts/diagnostics/staging-email-config.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CHECK_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CHECK_RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          CHECK_RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          CHECK_EMAIL_DISPATCH_SECRET: ${{ secrets.EMAIL_DISPATCH_SECRET }}
