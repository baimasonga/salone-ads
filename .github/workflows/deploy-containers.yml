name: Temporary staging administrator acceptance
on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
      staging_only:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  staging-billing-acceptance:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 6
    env:
      STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      STAGING_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
      STAGING_SERVICE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test subscription approval using temporary staging administrator
        run: node scripts/diagnostics/staging-admin-acceptance.mjs
      - name: Ensure temporary access and fixtures are removed
        if: always()
        run: node scripts/diagnostics/staging-admin-acceptance.mjs --cleanup
